name: Pre-commit Checks

on: [push, pull_request]

jobs:
  spam-gate:
    name: PR Spam Gate
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/pr-spam-gate.yml
    with:
      author: ${{ github.event.pull_request.user.login }}

  run:
    needs: [spam-gate]
    if: |
      always() &&
      (needs.spam-gate.result == 'skipped' || needs.spam-gate.outputs.blocked != 'true')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
    env:
      OS: ubuntu-latest
      PYTHON: "3.11"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update setuptools and wheel
        run: |
          pip install setuptools==68.2.2 wheel==0.41.2

      - name: Install QwenPaw with dev dependencies
        run: |
          pip install -q -e ".[dev]"

      - name: Install pre-commit hooks
        run: |
          pre-commit install

      - name: Run pre-commit
        run: |
          # Only check files changed in this PR, not the entire codebase
          CHANGED_FILES=$(git diff --name-only HEAD~1 | grep -E '\.(py|js|ts|tsx|jsx|json|yaml|yml)$' || true)
          if [ -z "$CHANGED_FILES" ]; then
            echo "No relevant files changed, skipping pre-commit"
            exit 0
          fi
          echo "Checking changed files: $CHANGED_FILES"
          pre-commit run --files $CHANGED_FILES 2>&1 | tee pre-commit.log || true
          if grep -q Failed pre-commit.log; then
            echo -e "\e[41m  [**FAIL**] pre-commit checks failed. Run 'pre-commit run --files <changed-files>' locally, commit any auto-fixes, then push again. \e[0m"
            exit 1
          fi
          echo -e "\e[46m  ********************************Passed******************************** \e[0m"
